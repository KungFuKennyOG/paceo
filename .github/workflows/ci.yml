name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: paceo
          POSTGRES_PASSWORD: paceo
          POSTGRES_DB: paceo_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U paceo"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Integration tests (apps/api) use this; unit tests must not require it.
      TEST_DATABASE_URL: postgres://paceo:paceo@localhost:5432/paceo_test
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # No lockfile committed yet; generate one locally with `pnpm install` and commit it,
      # then switch this to `pnpm install --frozen-lockfile`.
      - run: pnpm install --no-frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm -r --if-present build

  docker-smoke:
    # Builds the production image and walks the main user flow against it (deploy/smoke-test.sh).
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Smoke test
        run: |
          set -o pipefail
          bash deploy/smoke-test.sh 2>&1 | tee smoke.log
      - name: Report failure as annotation
        if: failure()
        run: |
          # Surface the tail of the log as one annotation (readable even where raw logs are not).
          msg=$(tail -60 smoke.log | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
          echo "::error title=docker smoke test::${msg}"
